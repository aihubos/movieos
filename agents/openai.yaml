interface:
  display_name: "MovieOS"
  short_description: "이미지 수량·저장 경로를 먼저 확인하고 웹 제작 가이드까지 완성"
  default_prompt: "$movieos로 유형·목적·분량·화풍·발화 언어와 씬별 첫 프레임 생성 여부·추가 관련 이미지 장수를 초반에 한 번에 질문하고, 영상명 폴더를 만들 상위 폴더의 실제 경로를 받아줘. 그 폴더에 썸네일과 선택한 씬 이미지가 저장됨을 설명해줘. 답변이 끝나면 추가 선택이나 요청 없이 대본·기준 시트·선택 수량의 이미지·영상 프롬프트를 만들고 웹 가이드를 반드시 생성·열기·확인해줘."
