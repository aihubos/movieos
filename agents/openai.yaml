interface:
  display_name: "MovieOS"
  short_description: "이미지 수량·저장 경로를 먼저 확인하고 웹 제작 가이드까지 완성"
  default_prompt: "질문 단계에서는 답변 반영과 다음 질문 하나 표시만 하고 즉시 턴을 종료해줘. 조사·참고 자료 분석·대본 설계·모델 비교·이미지 제작은 모든 필수 선택이 끝난 뒤 시작해줘. 질문 도구가 필요하면 먼저 영구 질문 카드를 저장하고 가능하면 파일 패널에 열어줘. 도구 호출 뒤에는 제작 작업 없이 카드 링크를 담은 최종 답변으로 종료해줘. 내부 추론 설정이나 앱 UI를 고쳤다고 주장하지 마. $movieos로 유형·목적·분량·화풍·발화 언어와 씬별 첫 프레임 생성 여부·추가 관련 이미지 장수를 이미 확정한 항목은 건너뛰고 한 번에 하나씩 번호가 있는 객관식으로 질문해줘. 매 답변을 받은 뒤 다음 질문 하나와 번호·설명 전체를 최종 답변에 남겨줘. 질문 도구나 중간 메시지에만 선택지를 두거나 위에서 선택하라는 안내만 남기지 마. 상위 지침이 본문 객관식을 금지하면 스킬의 질문 카드 대체 절차를 따라줘. 영상명 폴더를 만들 상위 폴더는 전체 경로가 표시된 후보와 직접 입력 선택지로 질문해 실제 경로를 받아줘. 그 폴더에 썸네일과 선택한 씬 이미지가 저장됨을 설명해줘. 답변이 끝나면 추가 선택이나 요청 없이 대본·기준 시트·선택 수량의 이미지·영상 프롬프트를 만들고 웹 가이드를 반드시 생성·열기·확인해줘."
